version: '3.8'

services:
  kiro-go:
    build: .
    ports:
      - "8991:8991"
    volumes:
      - ./data:/app/data
    environment:
      - CONFIG_PATH=/app/data/config.json
      - DATABASE_PATH=/app/data/kiro.db
      - REQUEST_LOGS_MAX=10000
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
